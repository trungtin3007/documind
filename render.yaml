# Render blueprint for the DocuMind demo.
#
# Serves the committed 194-page demo corpus (pages_demo/ + index_demo/), which
# is in the repo, so no corpus build happens at deploy time.
#
# Retrieval runs hybrid-bm25 rather than the adopted hybrid-embedding default.
# hybrid-embedding needs sentence-transformers, which pulls torch: ~500MB more
# to install and ~400MB more RSS, against a 512MB instance. With bm25 the served
# app peaks at ~116MB (measured in a clean venv built from requirements.txt) and
# there is no model download, so no cold-start penalty. BM25 scores 26/28 hit@3
# against embedding's 27/28 — one question, inside the noise RESULTS.md reports.
# To switch: install requirements-dev.txt, raise the plan, and set
# DOCUMIND_METHOD=hybrid-embedding.
#
# Secrets are marked sync:false and must be set in the Render dashboard. They
# are never stored in this file.
#
# User uploads are stored in Cloudflare R2 so they survive sleeps and redeploys.
# If the four R2_* variables are absent or wrong, storage.py falls back to local
# disk: uploads then do not survive a restart, but the fixed demo corpus and
# everything else keep working. A bad R2 config degrades uploads, it does not
# take down the demo.

services:
  - type: web
    name: documind
    runtime: python
    plan: free
    region: oregon
    branch: main

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Render supplies $PORT; binding 0.0.0.0 is required for the health check.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DOCUMIND_DATA
        value: demo
      - key: DOCUMIND_METHOD
        value: hybrid-bm25
      - key: DOCUMIND_ANSWER_MODEL
        value: gemini-3.6-flash
      # Keep pip from caching wheels into the image; the build disk is small.
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: VOYAGE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Cloudflare R2 — durable storage for user uploads. Set all four, or none.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
