<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuMind</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #14171a;
    --muted: #626b75;
    --line: #e2e6ea;
    --accent: #2f6feb;
    --warn: #a8500f;
    --warn-bg: #fdf3e7;
    --err: #b3261e;
    --err-bg: #fdeceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; }
  .ask { display: flex; gap: 10px; margin: 22px 0 6px; }
  input[type=text] {
    flex: 1; padding: 13px 15px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    padding: 13px 22px; font-size: 16px; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; }
  .hint code { background: #e9edf2; padding: 1px 5px; border-radius: 4px; cursor: pointer; }
  section { margin-top: 26px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .answer { font-size: 17px; white-space: pre-wrap; }
  .notfound { background: var(--warn-bg); border-color: #f0dcc0; color: var(--warn); }
  .error { background: var(--err-bg); border: 1px solid #f3cfcc; color: var(--err); border-radius: 12px; padding: 16px 20px; }
  .error .msg { font-weight: 600; }
  .cites { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; }
  figure { margin: 0; }
  figure img {
    display: block; width: 100%; max-width: 420px; height: auto;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  figcaption { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .thumb { flex: 0 0 auto; width: 132px; text-decoration: none; color: inherit; }
  .thumb img { display: block; width: 132px; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .thumb.is-cited img { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(47,111,235,.25); }
  .thumb .meta { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .spinner {
    width: 17px; height: 17px; border: 2px solid #cfd6de; border-top-color: var(--accent);
    border-radius: 50%; display: inline-block; vertical-align: -3px; margin-right: 9px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DocuMind</h1>
    <div class="sub">Ask a question about the indexed paper. Answers cite the page they came from.</div>
  </header>

  <div class="ask">
    <input id="q" type="text" placeholder="e.g. How many PII items and credentials were recovered?" autocomplete="off" autofocus>
    <button id="go">Ask</button>
  </div>
  <div class="hint">
    Try:
    <code class="sample">How many PII items and how many credentials were recovered?</code>
    <code class="sample">What is the cross-model compatibility of encrypted reasoning?</code>
  </div>

  <section id="loading" hidden>
    <div class="card"><span class="spinner"></span>Searching pages and reading them…</div>
  </section>

  <section id="errorBox" hidden>
    <div class="error"><div class="msg" id="errMsg"></div><div id="errHint" class="hint"></div></div>
  </section>

  <section id="result" hidden>
    <div class="card" id="answerCard">
      <div class="label">Answer</div>
      <div class="answer" id="answer"></div>
    </div>

    <section id="citedWrap">
      <div class="label">Cited page<span id="citedPlural"></span></div>
      <div class="cites" id="cited"></div>
    </section>

    <section>
      <div class="label">Pages retrieved <span id="methodTag" style="text-transform:none;letter-spacing:0"></span></div>
      <div class="strip" id="strip"></div>
    </section>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const q = $('q'), go = $('go');

document.querySelectorAll('.sample').forEach(el =>
  el.addEventListener('click', () => { q.value = el.textContent; ask(); }));

q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
go.addEventListener('click', ask);

function show(el, on) { el.hidden = !on; }

// The server sends a display label that names the source document when the
// corpus has more than one, so the UI never has to guess from the filename.
function labelOf(p) {
  return p.label || p.page;
}

async function ask() {
  const question = q.value.trim();
  if (!question) { q.focus(); return; }

  go.disabled = true;
  show($('loading'), true);
  show($('errorBox'), false);
  show($('result'), false);

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    if (!res.ok) { fail(data.error || ('Request failed (' + res.status + ')'), data.hint); return; }
    render(data);
  } catch (err) {
    fail('Could not reach the server.', String(err));
  } finally {
    go.disabled = false;
    show($('loading'), false);
  }
}

function fail(msg, hint) {
  $('errMsg').textContent = msg;
  $('errHint').textContent = hint || '';
  show($('errorBox'), true);
}

function render(data) {
  $('answer').textContent = data.answer || '(empty answer)';
  $('answerCard').classList.toggle('notfound', !data.found);

  const cited = data.cited_pages || [];
  $('citedPlural').textContent = cited.length === 1 ? '' : 's';
  const box = $('cited');
  box.innerHTML = '';
  show($('citedWrap'), cited.length > 0);
  (data.cited || cited.map(n => ({ page: n, label: n }))).forEach(p => {
    const name = p.page;
    const fig = document.createElement('figure');
    const a = document.createElement('a');
    a.href = '/page/' + name; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img');
    img.src = '/page/' + name;
    img.alt = labelOf(p);
    a.appendChild(img);
    const cap = document.createElement('figcaption');
    cap.textContent = labelOf(p) + ' — open full size';
    fig.append(a, cap);
    box.appendChild(fig);
  });

  $('methodTag').textContent = data.method ? '· ' + data.method : '';
  const strip = $('strip');
  strip.innerHTML = '';
  (data.retrieved_pages || []).forEach((p, i) => {
    const a = document.createElement('a');
    a.className = 'thumb' + (cited.includes(p.page) ? ' is-cited' : '');
    a.href = '/page/' + p.page; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img');
    img.src = '/page/' + p.page;
    img.alt = labelOf(p);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (i + 1) + '. ' + labelOf(p) + ' · ' + p.score.toFixed(4);
    a.append(img, meta);
    strip.appendChild(a);
  });

  show($('result'), true);
}
</script>
</body>
</html>
